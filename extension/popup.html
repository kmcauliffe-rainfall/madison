<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TailorFlow Capture</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 380px;
      max-height: 580px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 13px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fbbf24;
    }
    .badge {
      font-size: 10px;
      background: #374151;
      padding: 2px 6px;
      border-radius: 4px;
      color: #cbd5e1;
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 9px;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      max-height: 140px;
      overflow-y: auto;
      background: #020617;
      padding: 6px;
      border-radius: 6px;
      border: 1px dashed var(--border);
    }
    .media-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #1e293b;
    }
    .media-item.selected {
      border-color: var(--accent);
    }
    .media-item img, .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .media-item .overlay-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0,0,0,0.75);
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 12px;
      color: #e2e8f0;
    }
    .credits-box {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
    }
    .credits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .status-banner {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 10px;
      display: none;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #34d399;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #f87171;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>✂️ TailorFlow</span>
      <span class="badge">Hollywood</span>
    </div>
    <span style="font-size: 11px; color: var(--text-muted);">$20 / Post</span>
  </header>

  <div id="status-banner" class="status-banner"></div>

  <div class="form-group">
    <button id="btn-extract" class="btn">
      <span>🔍 Extract Media & Credits from Page</span>
    </button>
  </div>

  <div id="capture-container">
    <div class="form-group">
      <label>Extracted Media Assets (<span id="media-count">0</span>)</label>
      <div id="media-grid" class="media-grid">
        <p style="grid-column: span 3; text-align: center; color: var(--text-muted); padding: 16px 0; font-size: 11px;">
          Click "Extract" above while on an Instagram or Getty post.
        </p>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="chk-fullbody" checked>
        <label for="chk-fullbody" style="margin: 0; text-transform: none;">✨ Includes high-res full-body shot (shows hems/fit)</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="chk-reel">
        <label for="chk-reel" style="margin: 0; text-transform: none;">🎬 Isolate video as Standalone Reel</label>
      </div>
    </div>

    <div class="form-group">
      <label for="select-client">Client / Artist</label>
      <select id="select-client">
        <option value="Bright Eyes">Bright Eyes (Hollywood Bowl / Stage Fit)</option>
        <option value="Charli XCX">Charli XCX (VMAs / Chrome Hearts / YSL)</option>
        <option value="Music of Luna">Music of Luna (Fairy/Costume Tailoring)</option>
        <option value="Demi Lovato">Demi Lovato / Chris Horan</option>
        <option value="Gabby / Pandora Knox">Gabby / Pandora Knox (MV Project)</option>
        <option value="Replicant Labs">Replicant Labs (3D Structural Garments)</option>
        <option value="custom">-- Custom Client / Project --</option>
      </select>
      <input type="text" id="input-custom-client" placeholder="Enter custom client name..." style="display: none; margin-top: 4px;">
    </div>

    <div class="form-group">
      <label for="input-look-type">Look / Alteration Type</label>
      <input type="text" id="input-look-type" placeholder="e.g. Custom Pant Hem, Stage Suit, Corset Fit">
    </div>

    <div class="form-group">
      <label for="input-collaborator">Collaborator Account (Cross-Posting)</label>
      <input type="text" id="input-collaborator" value="@flowerthief">
    </div>

    <div class="credits-box">
      <label style="color: #fbbf24; margin-bottom: 6px;">Parsed Credits</label>
      <div class="credits-grid">
        <div>
          <label for="credit-stylist">Styling</label>
          <input type="text" id="credit-stylist" placeholder="@chrishoran20">
        </div>
        <div>
          <label for="credit-assistants">Assistants</label>
          <input type="text" id="credit-assistants" placeholder="Comma separated">
        </div>
        <div>
          <label for="credit-hair">Hair</label>
          <input type="text" id="credit-hair" placeholder="Hair artist">
        </div>
        <div>
          <label for="credit-makeup">Makeup</label>
          <input type="text" id="credit-makeup" placeholder="MUA">
        </div>
        <div>
          <label for="credit-nails">Nails</label>
          <input type="text" id="credit-nails" placeholder="Nail artist">
        </div>
        <div>
          <label for="credit-photo">Photo</label>
          <input type="text" id="credit-photo" placeholder="Photographer">
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 6px; margin-top: 10px;">
      <button id="btn-save-draft" class="btn" style="flex: 2;">
        🚀 Send to Review Dashboard
      </button>
      <button id="btn-copy-caption" class="btn btn-secondary" style="flex: 1;">
        📋 Copy
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
